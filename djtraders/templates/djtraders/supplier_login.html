{% extends "common/base.html" %}

{% block title %}Supplier Login{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card mt-4 border-0 shadow-sm">
                <div class="card-header fw-bolder h4">
                    <i class="fa-solid fa-truck-field dt-icon-supplier"></i>
                    Supplier Login
                </div>
                <div class="card-body">
                    {% if error %}
                        <div class="alert alert-danger py-2">{{ error }}</div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="supplier-select" class="form-label">Company</label>
                            <select name="supplier_id" id="supplier-select" class="form-select" required>
                                <option value="">Select your company</option>
                                {% for supplier in suppliers %}
                                    <option value="{{ supplier.supplier_id }}">{{ supplier.company_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="postal-code-input" class="form-label">Postal Code</label>
                            <input type="text" name="postal_code" id="postal-code-input" class="form-control" required>
                        </div>
                        <button type="submit" class="btn dt-btn-primary-supplier w3-hover-shadow w-100" title="Log in">
                            <i class="fa-solid fa-right-to-bracket me-1"></i>
                            Log In
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
